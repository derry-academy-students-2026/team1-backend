services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobRole
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    ports:
      - "4432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobRole"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data: