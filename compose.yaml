services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobRole
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    ports:
      - "4432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobRole"]
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/jobRole
    depends_on:
      db:
        condition: service_healthy
    command: npm run db:migrate && npm run db:seed
    restart: "no"

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/jobRole
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-before-production}
      NODE_ENV: production
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data: