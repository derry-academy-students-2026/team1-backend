name: CI and CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Install required npm version
        run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm exec prisma generate
      - run: npm run lint
      - run: npm test

  build-container:
    name: Build container image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: team1-backend:${{ github.sha }}

  push-image:
    name: Push image to ACR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-container
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/team1-backend:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/team1-backend:latest
      - name: Build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migration
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/team1-backend-migration:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/team1-backend-migration:latest

  terraform-plan:
    name: Terraform plan
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      TF_VAR_backend_image_tag: ${{ github.sha }}
      TF_VAR_postgresql_administrator_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - name: Initialize Terraform remote state
        run: >-
          terraform -chdir=infrastructure init -input=false
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}"
          -backend-config="key=team1-backend-dev.tfstate"
          -backend-config="use_oidc=true"
          -backend-config="use_azuread_auth=true"
      - name: Validate Terraform
        run: terraform -chdir=infrastructure validate
      - name: Plan Terraform changes
        run: terraform -chdir=infrastructure plan -input=false -no-color -out=tfplan
      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infrastructure/tfplan
          retention-days: 1

  terraform-apply:
    name: Terraform apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [push-image, terraform-plan]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      TF_VAR_backend_image_tag: ${{ github.sha }}
      TF_VAR_postgresql_administrator_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - name: Initialize Terraform remote state
        run: >-
          terraform -chdir=infrastructure init -input=false
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}"
          -backend-config="key=team1-backend-dev.tfstate"
          -backend-config="use_oidc=true"
          -backend-config="use_azuread_auth=true"
      - name: Apply reviewed Terraform plan
        run: terraform -chdir=infrastructure apply -input=false -auto-approve
      - name: Configure database connection secret
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          POSTGRES_FQDN=$(terraform -chdir=infrastructure output -raw postgresql_fqdn)
          POSTGRES_ADMIN_LOGIN=$(terraform -chdir=infrastructure output -raw postgresql_administrator_login)
          POSTGRES_DATABASE=$(terraform -chdir=infrastructure output -raw postgresql_database_name)
          KEY_VAULT_NAME=$(terraform -chdir=infrastructure output -raw key_vault_name)
          POSTGRES_PASSWORD_ENCODED=$(node -p 'encodeURIComponent(process.env.POSTGRES_ADMIN_PASSWORD)')
          DATABASE_URL="postgresql://${POSTGRES_ADMIN_LOGIN}:${POSTGRES_PASSWORD_ENCODED}@${POSTGRES_FQDN}:5432/${POSTGRES_DATABASE}?sslmode=require"
          az keyvault secret set --vault-name "$KEY_VAULT_NAME" --name DatabaseUrlString --value "$DATABASE_URL" --output none
      - name: Apply pending database migrations
        run: |
          RESOURCE_GROUP=$(terraform -chdir=infrastructure output -raw resource_group_name)
          JOB_NAME=$(terraform -chdir=infrastructure output -raw database_migration_job_name)
          az containerapp job start --name "$JOB_NAME" --resource-group "$RESOURCE_GROUP"
      - name: Restart backend with the updated database connection
        run: |
          RESOURCE_GROUP=$(terraform -chdir=infrastructure output -raw resource_group_name)
          APP_NAME=$(terraform -chdir=infrastructure output -raw backend_container_app_name)
          REVISION_NAME=$(az containerapp revision list --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query "[?properties.active] | [0].name" --output tsv)
          az containerapp revision restart --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --revision "$REVISION_NAME"
